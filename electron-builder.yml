appId: cz.pmlio.helper
productName: PMLio Helper
directories:
  output: dist

win:
  target: nsis
  icon: assets/icon.ico

mac:
  target: dmg
  icon: assets/icon.icns
  category: public.app-category.utilities

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false

files:
  - src/**/*
  - assets/**/*
  - node_modules/**/*
  - package.json
